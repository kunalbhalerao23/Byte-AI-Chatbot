<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byte — Your AI Coding Mentor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090e;
      --panel: #111421;
      --panel-2: #1b2032;
      --panel-3: #222840;
      --text: #f5f6ff;
      --muted: #a7aec6;
      --accent: #6658f5;
      --accent-hover: #786cff;
      --border: #30364d;
      --error-bg: #3b201f;
      --error: #ffaaa2;
      --success: #8de0b1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: flex; }
    .sidebar {
      width: 250px; flex: 0 0 250px; background: #0d101a; border-right: 1px solid var(--border);
      padding: 18px 12px; display: flex; flex-direction: column; gap: 18px;
      transition: width .2s ease, flex-basis .2s ease, padding .2s ease; overflow: hidden;
    }
    .sidebar.collapsed { width: 0; flex-basis: 0; padding-left: 0; padding-right: 0; border: 0; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px;
      border-radius: 13px; background: var(--accent); color: white; }
    .brand-name { font-size: 18px; font-weight: 750; letter-spacing: -.3px; }
    .brand-sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 10px 12px; color: var(--text); background: transparent; border: 1px solid var(--border);
      border-radius: 11px; }
    .new-chat:hover, .icon-btn:hover { background: var(--panel-2); border-color: #555d7a; }
    .sidebar-label { color: #818aa7; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.1px; padding: 0 9px; }
    .history-note { padding: 0 9px; color: #77809b; font-size: 12px; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding: 14px 9px 0;
      color: #818aa7; font-size: 12px; }
    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { height: 62px; flex: 0 0 62px; padding: 0 24px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid rgba(48,54,77,.8); }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; color: var(--muted);
      background: transparent; border: 1px solid transparent; border-radius: 10px; }
    .top-title { font-size: 14px; font-weight: 650; }
    .top-sub { color: var(--muted); font-size: 12px; }
    .status { color: var(--success); font-size: 12px; display: flex; align-items: center; gap: 7px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .log { width: 100%; max-width: 920px; margin: 0 auto; padding: 28px 24px 22px; flex: 1;
      overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .welcome { margin: auto 0; display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 20px 0 32px; }
    .sparkle { color: #a99fff; margin-bottom: 8px; }
    .welcome h1 { margin: 0; font-size: clamp(23px, 3vw, 30px); line-height: 1.25; letter-spacing: -.8px; }
    .welcome p { color: var(--muted); margin: 10px 0 28px; font-size: 14px; }
    .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
      width: 100%; text-align: left; }
    .suggestion { background: var(--panel-2); border: 1px solid var(--border); border-radius: 15px;
      padding: 16px; color: var(--text); text-align: left; min-height: 112px; transition: .15s ease; }
    .suggestion:hover { background: #232943; border-color: #655cf0; transform: translateY(-1px); }
    .suggestion svg { color: #aaa0ff; margin-bottom: 8px; }
    .suggestion strong { display: block; font-size: 15px; margin-bottom: 4px; }
    .suggestion span { display: block; color: var(--muted); font-size: 12px; }
    .msg { max-width: min(82%, 760px); padding: 13px 16px; border-radius: 15px; white-space: pre-wrap;
      overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: #5145e5; color: white; border-bottom-right-radius: 5px; }
    .msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid rgba(48,54,77,.65);
      border-bottom-left-radius: 5px; }
    .msg.error { align-self: center; max-width: 95%; color: var(--error); background: var(--error-bg);
      border: 1px solid #5b302d; font-size: 13px; }
    .msg pre { background: #0b0e17; border: 1px solid #343a51; border-radius: 10px; padding: 12px;
      overflow-x: auto; margin: 10px 0; white-space: pre; }
    .msg code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9em; }
    .typing { display: flex; gap: 5px; align-items: center; min-width: 62px; }
    .typing span { width: 6px; height: 6px; background: #a7aec6; border-radius: 50%; animation: pulse 1.1s infinite; }
    .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 70%, 100% { opacity: .3; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }
    .composer-wrap { padding: 0 24px 18px; }
    .composer-inner { max-width: 920px; margin: 0 auto; }
    .context { text-align: center; color: #858da8; font-size: 11px; min-height: 18px; margin-bottom: 6px; }
    .composer { display: flex; align-items: flex-end; gap: 10px; padding: 12px; border: 1px solid var(--accent);
      background: var(--panel-2); border-radius: 18px; box-shadow: 0 0 0 1px rgba(102,88,245,.08); }
    .composer:focus-within { border-color: #8a80ff; box-shadow: 0 0 0 3px rgba(102,88,245,.13); }
    textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent;
      color: var(--text); padding: 3px 2px; max-height: 160px; line-height: 1.5; }
    textarea::placeholder { color: #a7aec6; }
    .composer-tools { display: flex; gap: 3px; align-items: center; }
    .send { width: 40px; height: 40px; flex: 0 0 40px; border: 0; border-radius: 10px;
      display: grid; place-items: center; background: var(--accent); color: white; }
    .send:hover { background: var(--accent-hover); }
    .send:disabled { opacity: .45; cursor: not-allowed; }
    .hint { color: #737c97; text-align: center; font-size: 11px; margin-top: 8px; }
    .retry { margin-left: 8px; border: 1px solid #80514e; background: transparent; color: var(--error);
      border-radius: 7px; padding: 3px 8px; font-size: 12px; }
    .hidden { display: none !important; }
    @media (max-width: 700px) {
      .sidebar { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; box-shadow: 15px 0 40px #0007; }
      .sidebar.collapsed { display: none; }
      .topbar { padding: 0 14px; }
      .log { padding: 20px 14px; }
      .composer-wrap { padding: 0 12px 12px; }
      .suggestions { grid-template-columns: 1fr; gap: 9px; }
      .suggestion { min-height: 88px; padding: 13px; }
      .welcome { padding: 10px 0 20px; }
      .welcome p { margin-bottom: 20px; }
      .msg { max-width: 92%; }
      .status { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="m8 6-5 6 5 6M16 6l5 6-5 6M14 4l-4 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><div class="brand-name">Byte</div><div class="brand-sub">Your AI coding mentor</div></div>
    </div>
    <button class="new-chat" id="reset" type="button"><span>＋</span> New chat</button>
    <div class="sidebar-label">Workspace</div>
    <div class="history-note">Start a new chat to explore a coding question.</div>
    <div class="sidebar-bottom">Made for learning, debugging, and building.</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="toggle-sidebar" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M9 4v16" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
        <div><div class="top-title">Byte <span style="color:var(--muted);font-weight:400">/ Coding Mentor</span></div><div class="top-sub">Ask. Learn. Build.</div></div>
      </div>
      <div class="status"><span class="status-dot"></span> Ready to help</div>
    </header>

    <section class="chat" aria-label="Chat with Byte">
      <div id="log" class="log" aria-live="polite"></div>
      <div class="composer-wrap">
        <div class="composer-inner">
          <div id="ctx" class="context"></div>
          <form id="form" class="composer">
            <div class="composer-tools">
              <button class="icon-btn" type="button" id="focus-input" aria-label="Focus message input" title="Write a message">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M8 7 4 12l4 5M16 7l4 5-4 5M14 4l-4 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <textarea id="input" rows="1" maxlength="4000" placeholder="Ask Byte anything..." autofocus aria-label="Your message"></textarea>
            <button id="send" class="send" type="submit" aria-label="Send message" title="Send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>
          <div class="hint">Enter to send · Shift + Enter for a new line</div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const ctx = document.getElementById('ctx');
  const sidebar = document.getElementById('sidebar');
  let conversationId = null;
  let lastPrompt = '';
  let welcomeEl = null;

  const icons = {
    bug: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M8 8 5 5m11 3 3-3M4 13H2m20 0h-2M5 18l-2 2m16-2 2 2M7 10h10v6a5 5 0 0 1-10 0zM9 5l-1-2m7 2 1-2M9 13h6m-6 3h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    book: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 7c-2-2-5-2-9-2v14c4 0 7 0 9 2m0-14c2-2 5-2 9-2v14c-4 0-7 0-9 2m0-14v14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
    code: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m8 6-5 6 5 6m8-12 5 6-5 6M14 4l-4 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    bulb: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 18h6m-5 4h4m-2-20a7 7 0 0 0-4 12.7c.8.6 1 1.3 1 2.3h6c0-1 .2-1.7 1-2.3A7 7 0 0 0 12 2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  const suggestions = [
    { icon: 'bug', title: 'Debug my code', desc: 'Find and explain errors', prompt: 'Help me debug this code. Explain the cause of the error and how to fix it:' },
    { icon: 'book', title: 'Learn a concept', desc: 'Understand it step by step', prompt: 'Explain a programming concept step by step, with a simple example.' },
    { icon: 'code', title: 'Write code', desc: 'Build a working example', prompt: 'Help me write code for the following task. Explain the important parts:' },
    { icon: 'bulb', title: 'Project ideas', desc: 'Explore your next project', prompt: 'Suggest some practical and distinctive programming project ideas for my current skill level.' }
  ];

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function renderMessage(text) {
    // Escape first so model output is displayed as text, not executable HTML.
    let safe = escapeHtml(text);
    safe = safe.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (_, language, code) =>
      `<pre><code>${code}</code></pre>`);
    safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    return safe.replace(/\n/g, '<br>');
  }

  function addMessage(role, text) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;
    if (role === 'bot') el.innerHTML = renderMessage(text);
    else el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function showWelcome() {
    log.innerHTML = '';
    welcomeEl = document.createElement('div');
    welcomeEl.className = 'welcome';
    welcomeEl.innerHTML = `
      <div class="sparkle" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3ZM19 15l1.1 2.9L23 19l-2.9 1.1L19 23l-1.1-2.9L15 19l2.9-1.1L19 15Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
      <h1>What are we building today?</h1>
      <p>Ask questions, debug code, or explore new ideas.</p>
      <div class="suggestions">
        ${suggestions.map((s, i) => `<button type="button" class="suggestion" data-suggestion="${i}">${icons[s.icon]}<strong>${s.title}</strong><span>${s.desc}</span></button>`).join('')}
      </div>`;
    log.appendChild(welcomeEl);
    welcomeEl.querySelectorAll('[data-suggestion]').forEach(button => {
      button.addEventListener('click', () => {
        const selected = suggestions[Number(button.dataset.suggestion)];
        input.value = selected.prompt;
        resizeInput();
        input.focus();
      });
    });
  }

  function addTyping() {
    const el = document.createElement('div');
    el.className = 'msg bot typing';
    el.setAttribute('aria-label', 'Byte is thinking');
    el.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function sendMessage(text) {
    lastPrompt = text;
    sendBtn.disabled = true;
    const typingEl = addTyping();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 60000);

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation_id: conversationId, message: text }),
        signal: controller.signal
      });
      let data = {};
      try { data = await response.json(); } catch (_) {}
      typingEl.remove();

      if (!response.ok) {
        const message = data.error || (response.status === 429
          ? 'The AI service is busy right now. Please wait a little before retrying.'
          : `Request failed (${response.status}). Please try again.`);
        const errorEl = addMessage('error', message);
        const retry = document.createElement('button');
        retry.className = 'retry';
        retry.type = 'button';
        retry.textContent = 'Retry';
        retry.addEventListener('click', () => {
          errorEl.remove();
          sendMessage(lastPrompt);
        });
        errorEl.appendChild(retry);
        return;
      }

      conversationId = data.conversation_id ?? conversationId;
      addMessage('bot', data.reply || 'I did not receive a response. Please try again.');
      const context = data.context;
      ctx.textContent = context
        ? `Memory: last ${context.messages_in_window} messages${context.has_summary ? ' + summary of earlier chat' : ''}`
        : '';
    } catch (error) {
      typingEl.remove();
      const message = error.name === 'AbortError'
        ? 'This request timed out. Please try again.'
        : "Couldn't reach the server. Check your connection and try again.";
      const errorEl = addMessage('error', message);
      const retry = document.createElement('button');
      retry.className = 'retry';
      retry.type = 'button';
      retry.textContent = 'Retry';
      retry.addEventListener('click', () => {
        errorEl.remove();
        sendMessage(lastPrompt);
      });
      errorEl.appendChild(retry);
    } finally {
      clearTimeout(timer);
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function resizeInput() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    if (welcomeEl) {
      welcomeEl.remove();
      welcomeEl = null;
    }
    addMessage('user', text);
    input.value = '';
    resizeInput();
    sendMessage(text);
  });

  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener('input', resizeInput);
  document.getElementById('focus-input').addEventListener('click', () => input.focus());
  document.getElementById('toggle-sidebar').addEventListener('click', () => sidebar.classList.toggle('collapsed'));

  document.getElementById('reset').addEventListener('click', async () => {
    const oldConversationId = conversationId;
    conversationId = null;
    if (oldConversationId) {
      try {
        await fetch('/api/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversation_id: oldConversationId })
        });
      } catch (_) { /* Starting a new local chat should still work if reset fails. */ }
    }
    ctx.textContent = '';
    lastPrompt = '';
    showWelcome();
    input.value = '';
    resizeInput();
    input.focus();
  });

  showWelcome();
</script>
</body>
</html>
